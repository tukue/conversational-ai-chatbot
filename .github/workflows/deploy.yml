name: Deploy to HuggingFace

on:
  push:
    branches: [main]
    paths-ignore:
      - "tests/**"
      - ".github/**"
      - "**.md"
      - "requirements-dev.txt"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Validate HF config
        run: |
          sed -n '/^---$/,/^---$/p' README.md | sed '1d;$d' > /tmp/meta.yml
          for f in title sdk app_file python_version; do
            grep -q "^${f}:" /tmp/meta.yml || { echo "::error::Missing: $f"; exit 1; }
          done
          [ -f runtime.txt ] || { echo "::error::Missing runtime.txt"; exit 1; }
          echo "HF config OK"

      - name: Deploy to HuggingFace
        run: |
          echo "All checks passed."
          echo "HF Spaces auto-syncs from this GitHub repo."
          echo "Your Space will rebuild automatically."
          echo ""
          echo "First time setup:"
          echo "  1. Create Space: https://huggingface.co/new-space"
          echo "     - SDK: Gradio"
          echo "     - Python: 3.10"
          echo "  2. Go to Space Settings > Connect repository"
          echo "  3. Link this GitHub repo (main branch, root)"
          echo "  4. Done. Every push to main auto-deploys."
          echo ""
          echo "Space: https://huggingface.co/spaces/tukue/customer-support-chatbot"
