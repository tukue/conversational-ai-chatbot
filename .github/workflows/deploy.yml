name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths-ignore:
      - "tests/**"
      - "requirements-dev.txt"
  workflow_dispatch:

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-proxy.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Install hf CLI
        run: python -m pip install --upgrade "huggingface_hub>=0.30.0"

      - name: Deploy to HuggingFace Spaces
        env:
          HF_OIDC_RESOURCE: spaces/Tukue/customer-support-ai
        run: |
          echo "Deploying to Hugging Face Space..."
          hf upload \
            Tukue/customer-support-ai \
            . . \
            --repo-type space \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "__pycache__/*" \
            --exclude "tests/*" \
            --exclude "*.pyc" \
            --exclude "requirements-dev.txt" \
            --commit-message "Deploy from GitHub $GITHUB_SHA"

          echo "Done: https://huggingface.co/spaces/Tukue/customer-support-ai"
