name: Deploy to HuggingFace

on:
  push:
    branches: [main]
    paths-ignore:
      - "tests/**"
      - ".github/**"
      - "**.md"
      - "requirements-dev.txt"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Test
        run: python -m pytest tests/ -v --tb=short

      - name: Install hf CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy to HuggingFace Spaces
        env:
          HF_OIDC_RESOURCE: spaces/tukue/customer-support-chatbot
        run: |
          echo "Deploying to HuggingFace Spaces..."
          hf upload \
            tukue/customer-support-chatbot \
            . . \
            --repo-type space \
            --include "*.py" "*.txt" "*.json" "*.yml" "*.yaml" \
            --exclude ".git/*" "__pycache__/*" "tests/*" "*.pyc" \
            --delete \
            --commit-message "Deploy from GitHub $GITHUB_SHA"

          echo "Done: https://huggingface.co/spaces/tukue/customer-support-chatbot"
