name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Sync to Hugging Face Spaces
        env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_SPACE" ]; then
            echo "::warning::HF_SPACE secret not set. Skipping sync."
            exit 0
          fi

          echo "Syncing to: https://huggingface.co/spaces/$HF_SPACE"

          huggingface-cli upload \
            --repo-type space \
            --include "*.py" "*.txt" "*.json" "*.md" "*.yml" \
            --exclude ".git/*" "__pycache__/*" ".pytest_cache/*" ".venv/*" "*.pyc" \
            "$HF_SPACE" . \
            --commit-message "Sync from GitHub ${{ github.sha }}"

          echo "Done: https://huggingface.co/spaces/$HF_SPACE"
